<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">
  <div class="container auth-container">
    <h1>Register</h1>
    <div class="form">
      <form id="form">
        <div class="form-control">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username">
        </div>
        <div class="form-control">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="form-control">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password">
        </div>
        <div class="form-control">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm your password">
        </div>
        <button type="button" class="btn" id="register-btn">Register</button>
        <a href="login.html" class="auth-link">Already have an account? Login</a>
      </form>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:8080/ExpTrack";

    document.getElementById('register-btn').addEventListener('click', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirm-password').value.trim();

      if (!username || !email || !password || !confirmPassword) {
        alert('Please fill in all fields.');
        return;
      }

      if (password !== confirmPassword) {
        alert('Passwords do not match.');
        return;
      }

      const userPayload = { username, email, password };

      try {
        const response = await fetch(`${API_BASE_URL}/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(userPayload)
        });

        const data = await response.json();

        if (!response.ok) {
          alert("Registration Error: " + (data.message || "Could not register"));
          return;
        }

        alert("Registration successful for: " + data.username);
        window.location.href = 'login.html';
      } catch (error) {
        alert("Request failed: " + error.message);
      }
    });
  </script>
</body>

</html>
